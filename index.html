
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northbound Coffee</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400i,700,700i">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-content">

            <a href="#" class="logo">Northbound Coffee</a>

            <nav class="desktop-nav">
                <a href="#">Home</a>
                <a href="#shop">Shop</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>

            <button class="menu-button" aria-label="Open navigation">
                ☰
            </button>

            </div>
    </header>


    <main>

        <!-- Hero Section -->
        <section class="hero">
            <div class="container hero-content">

                <div class="hero-text">
                    <p class="eyebrow">Small Batch Coffee Roasters</p>

                    <h1>Great Coffee for Your Next Adventure.</h1>

                    <p>
                        Carefully sourced beans, roasted in small batches,
                        and delivered fresh to your door.
                    </p>

                    <a href="#shop" class="button">Shop Our Coffee</a>
                </div>

                <div class="hero-image">
                    <div class="coffee-placeholder">
                        ☕
                    </div>
                </div>

            </div>
        </section>


        <!-- Features Section -->
        <section class="features" id="about">
            <div class="container">

                <div class="section-heading">
                    <p class="eyebrow">Why Northbound?</p>
                    <h2>Made With Care</h2>
                </div>

                <div class="feature-grid">

                    <article class="feature-card">
                        <div class="feature-icon">🌱</div>
